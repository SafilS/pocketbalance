
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketBalance</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>PocketBalance</h1>
            <p>Your personal balance tracker</p>
        </header>

        <section id="setupSection" class="card hidden">
            <h2>Welcome to PocketBalance</h2>
            <p>Configure your initial bank balance to get started.</p>

            <form id="setupForm">
                <label for="initialBalance">Initial Balance (₹)</label>
                <input
                    type="number"
                    id="initialBalance"
                    placeholder="Enter your initial balance"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">Configure Balance</button>
            </form>
        </section>

        <section id="dashboardSection" class="card hidden">
            <p class="label">AVAILABLE BALANCE</p>
            <h2 id="balance">₹0.00</h2>
            <p>Welcome back!</p>
        </section>

        <p id="message"></p>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
